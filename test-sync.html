<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Prueba de sincronización</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#1e293b;background:#fff}
h1{font-size:20px}
input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #cbd5e1;width:100%;box-sizing:border-box;margin:4px 0}
button{background:#059669;color:#fff;border:0;font-weight:700}
button.sec{background:#475569}button.warn{background:#b45309}
.card{background:#f1f5f9;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;line-height:1.6}
.ok{color:#047857}.ko{color:#b91c1c}
li{margin:6px 0;font-size:13px;list-style:none;background:#ecfdf5;border-radius:8px;padding:8px}
ul{padding:0}
</style>
</head>
<body>
<h1>Prueba de sincronización</h1>
<div id="estado" class="card">Cargando…</div>

<div id="login" hidden>
  <input id="email" type="email" placeholder="Correo" autocomplete="username">
  <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button id="bLogin">Iniciar sesión</button>
</div>

<div id="app" hidden>
  <input id="texto" placeholder="Escribe un mensaje de prueba">
  <button id="bEnviar">Enviar mensaje</button>
  <ul id="lista"></ul>
  <button class="warn" id="bReglas">Probar reglas (cierra sesión y intenta leer)</button>
  <button class="sec" id="bSalir">Cerrar sesión</button>
</div>
<div id="resultado" class="card" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5bRjagMvmXgxLEI8Pjnl-RSYgfhZvfCE",
  authDomain: "asesor-nutricionista.firebaseapp.com",
  projectId: "asesor-nutricionista",
  storageBucket: "asesor-nutricionista.firebasestorage.app",
  messagingSenderId: "773072878607",
  appId: "1:773072878607:web:bb12e84a4be5ae10c8b77a"
};

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let cacheModo = 'solo memoria (sin persistencia)', db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) }); cacheModo = 'persistente (IndexedDB)'; }
catch (e) { db = initializeFirestore(app, {}); }

const ua = navigator.userAgent;
const so = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : 'Otro';
const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const dispositivo = so + (standalone ? ' (app instalada)' : ' (navegador)');

let usuario = null, ultimoSnap = 'sin datos aún', unsub = null;
function pintaEstado() {
  $('estado').innerHTML =
    `Dispositivo: <b>${dispositivo}</b><br>` +
    `Conexión: <b class="${navigator.onLine ? 'ok' : 'ko'}">${navigator.onLine ? 'con red' : 'SIN red'}</b><br>` +
    `Caché local: <b>${cacheModo}</b><br>` +
    `Sesión: <b>${usuario ? usuario.email : 'no iniciada'}</b><br>` +
    `Última lectura: <b>${ultimoSnap}</b>`;
}
addEventListener('online', pintaEstado); addEventListener('offline', pintaEstado);

function resultado(t, ok) { const r = $('resultado'); r.hidden = false; r.className = 'card ' + (ok ? 'ok' : 'ko'); r.textContent = t; }

$('bLogin').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); $('pass').value = ''; $('resultado').hidden = true; }
  catch (e) { resultado('Error de inicio de sesión: ' + e.code, false); }
};
$('bSalir').onclick = () => signOut(auth);

$('bEnviar').onclick = () => {
  const t = $('texto').value.trim(); if (!t || !usuario) return;
  addDoc(collection(db, 'pruebas'), { texto: t, autor: usuario.email, dispositivo, ts: serverTimestamp() })
    .catch(e => resultado('Error al escribir: ' + e.code, false));
  $('texto').value = '';
};

function escuchar() {
  if (unsub) unsub();
  const q = query(collection(db, 'pruebas'), orderBy('ts', 'desc'), limit(15));
  unsub = onSnapshot(q, { includeMetadataChanges: true }, snap => {
    ultimoSnap = snap.metadata.fromCache ? 'desde la caché local (no confirmada con el servidor)' : 'confirmada por el servidor';
    pintaEstado();
    const ul = $('lista'); ul.innerHTML = '';
    snap.docs.forEach(d => {
      const x = d.data(), li = document.createElement('li');
      const hora = x.ts ? x.ts.toDate().toLocaleTimeString('es-ES') : '—';
      li.textContent = `${x.texto}  ·  ${x.dispositivo || '?'}  ·  ${hora}` + (d.metadata.hasPendingWrites ? '  ·  ⏳ pendiente de enviar' : '');
      ul.appendChild(li);
    });
  }, e => resultado('Error al leer: ' + e.code + (e.code === 'permission-denied' ? ' (revisa las reglas y que tu UID esté en ellas)' : ''), false));
}

$('bReglas').onclick = async () => {
  if (!navigator.onLine) return resultado('Conéctate a la red para esta prueba (sin red podría leer de la caché y dar un falso resultado).', false);
  await signOut(auth);
  try {
    await getDocs(query(collection(db, 'pruebas'), limit(1)));
    resultado('⚠️ Sin sesión SÍ se pudo leer: las reglas están demasiado abiertas. Corrígelas en Firestore → Rules.', false);
  } catch (e) {
    resultado(e.code === 'permission-denied' ? '✅ Sin sesión, Firestore rechaza la lectura (permission-denied). Las reglas funcionan. Vuelve a iniciar sesión.' : 'Resultado inesperado: ' + e.code, e.code === 'permission-denied');
  }
};

onAuthStateChanged(auth, u => {
  usuario = u; pintaEstado();
  $('login').hidden = !!u; $('app').hidden = !u;
  if (u) escuchar(); else if (unsub) { unsub(); unsub = null; }
});
pintaEstado();
</script>
</body>
</html>
